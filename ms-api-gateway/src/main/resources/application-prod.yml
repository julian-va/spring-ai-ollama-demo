spring:
  config:
    activate:
      on-profile: prod

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak/realms/mi-realm
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ms-suggestions-recommender-stream
              uri: http://spring-boot-service-ms-suggestions:8081
              predicates:
                - Path=/ai/recommender/stream
              filters:
                - RewritePath=/ai/recommender/stream, /ai/recommender/stream
            - id: ms-suggestions-recommender-sync
              uri: http://spring-boot-service-ms-suggestions:8081
              predicates:
                - Path=/ai/recommender/sync
              filters:
                - RewritePath=/ai/recommender/sync, /ai/recommender/sync
            - id: ms-suggestions-api-docs
              uri: http://spring-boot-service-ms-suggestions:8081
              predicates:
                - Path=/suggestions/api-docs/**
              filters:
                - RewritePath=/suggestions/(?<segment>.*), /${segment}
            - id: auth-keycloak
              uri: http://keycloak:8082
              predicates:
                - Path=/public/auth/**
              filters:
                - RewritePath=/public/auth/(?<segment>.*), /${segment}