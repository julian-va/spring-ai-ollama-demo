spring:
  config:
    activate:
      on-profile: prod

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: spring-gateway
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}

  cloud:
    gateway:
      routes:
        - id: ms-suggestions-recommender-stream
          uri: ${SUGGESTIONS_SERVICE_URI}
          predicates:
            - Path=/ai/recommender/stream
          filters:
            - RewritePath=/ai/recommender/stream, /ai/recommender/stream
        - id: ms-suggestions-recommender-sync
          uri: ${SUGGESTIONS_SERVICE_URI}
          predicates:
            - Path=/ai/recommender/sync
          filters:
            - RewritePath=/ai/recommender/sync, /ai/recommender/sync
        - id: suggestions-api-docs
          uri: ${SUGGESTIONS_SERVICE_URI}
          predicates:
            - Path=/suggestions/api-docs/**
          filters:
            - RewritePath=/suggestions/(?<segment>.*), /${segment}
        - id: auth-keycloak
          uri: ${KEYCLOAK_AUTH_URI}
          predicates:
            - Path=/public/auth/**
          filters:
            - RewritePath=/public/auth/(?<segment>.*), /${segment}
