spring:
  application:
    name: ms-suggestions


server:
  port: 8081
  

logging:
  level:
    org.springframework.ai: DEBUG

ollama:
  base-url: "http://localhost:11434"
  connect-timeout-ms: 60000
  response-timeout-s: 300
  llama:
    model: "llama3:latest"
    temperature: 0.6
    numPredict: 1024
    keepAlive: "10m"
    numGPU: 22
